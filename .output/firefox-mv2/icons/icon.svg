<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- YouTube Red & Orange Gradient -->
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e54" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Cyan Electric Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" filter="url(#dropShadow)" />

  <!-- Background Decorative Grid Lines / Radar Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.4" />

  <!-- Robot Head Chassis -->
  <!-- Antennas -->
  <path d="M256 140 L256 95" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="85" r="16" fill="#38bdf8" filter="url(#glow)" />

  <path d="M160 170 L120 120" stroke="#6366f1" stroke-width="10" stroke-linecap="round" />
  <circle cx="110" cy="110" r="12" fill="#6366f1" />

  <path d="M352 170 L392 120" stroke="#ef4444" stroke-width="10" stroke-linecap="round" />
  <circle cx="402" cy="110" r="12" fill="#ef4444" />

  <!-- Robot Face Outline / Outer Shell -->
  <rect x="116" y="140" width="280" height="230" rx="56" fill="#1e293b" stroke="#334155" stroke-width="6" />

  <!-- Inner Screen / Visor -->
  <rect x="136" y="160" width="240" height="190" rx="40" fill="#0b0f19" stroke="#1e293b" stroke-width="4" />

  <!-- Glowing Robot Eyes / Visor Display -->
  <g filter="url(#glow)">
    <!-- Left Eye (Radar HUD style) -->
    <circle cx="195" cy="225" r="26" fill="#0284c7" />
    <circle cx="195" cy="225" r="16" fill="#38bdf8" />
    <circle cx="195" cy="225" r="7" fill="#ffffff" />

    <!-- Right Eye (Radar HUD style) -->
    <circle cx="317" cy="225" r="26" fill="#0284c7" />
    <circle cx="317" cy="225" r="16" fill="#38bdf8" />
    <circle cx="317" cy="225" r="7" fill="#ffffff" />
  </g>

  <!-- Central Play / Autopilot Badge -->
  <g filter="url(#glow)" transform="translate(0, 10)">
    <!-- YouTube Play Icon Screen Badge -->
    <path d="M230 270 L295 305 L230 340 Z" fill="url(#ytGrad)" />
  </g>

  <!-- Side Ear / Audio Node Accents -->
  <rect x="96" y="215" width="20" height="80" rx="8" fill="#38bdf8" />
  <rect x="396" y="215" width="20" height="80" rx="8" fill="#ef4444" />

  <!-- Bottom Tech Bar Nodes -->
  <circle cx="210" cy="400" r="6" fill="#38bdf8" />
  <circle cx="256" cy="400" r="6" fill="#6366f1" />
  <circle cx="302" cy="400" r="6" fill="#ef4444" />
</svg>
